<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>📜 剧本创作管理</h1>
    <span class="brand-sub">阅读预览</span>

  <div class="preview-toolbar">
    <a class="btn small" id="linkBack" href="#">← 返回编辑</a>

      <h1 id="pvTitle"></h1>
      <p class="pv-author"><span id="pvAuthor"></span> · <span id="pvStatus"></span></p>
      <p class="pv-synopsis" id="pvSynopsis"></p>
    </div>
    <div id="pvScenes"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/preview.js"></script>
