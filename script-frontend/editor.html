<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑剧本 · 剧本创作管理</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>📜 剧本创作管理</h1>
    <span class="brand-sub">编辑</span>
  </header>

  <main class="container">
    <div class="breadcrumb">
      <a href="index.html">← 返回列表</a>
      <a id="linkPreview" href="#">阅读预览 →</a>
    </div>

    <section class="panel">
      <h2>剧本信息</h2>
      <div class="meta-grid">
        <label>剧名
          <input id="metaTitle" maxlength="60">
        </label>
        <label>作者
          <input id="metaAuthor" maxlength="30">
        </label>
        <label>草稿状态
          <select id="metaStatus">
            <option value="DRAFT">草稿</option>
            <option value="REVISING">修改中</option>
            <option value="FINAL">已定稿</option>
          </select>
        </label>
      </div>
      <label>简介
        <textarea id="metaSynopsis" rows="2"></textarea>
      </label>
      <div class="actions">
        <span id="metaSaved" class="saved-tip"></span>
        <button class="btn primary" id="btnSaveMeta">保存信息</button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>场次与台词</h2>
        <button class="btn" id="btnAddScene">＋ 添加场次</button>
      </div>
      <div id="sceneList"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
